{% extends 'base.html' %}
{% block content %}
<div class="campaign-container">

    <h3 style="text-align: center;">Add New Campaign</h3>

    {% if messages %}
    {% for message in messages %}
    <div class="alert 
                {% if message.tags == 'error' %}alert-danger
                {% elif message.tags == 'success' %}alert-success
                {% elif message.tags == 'info' %}alert-info
                {% else %}alert-secondary{% endif %}
                alert-dismissible fade show mt-3" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% endif %}


    <form action="{% url 'add_campaign' %}" method="post" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Title</label>
                <input type="text" name="title" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Location</label>
                <input type="search" name="location" class="form-control" id="location" required>
                <button class="btn btn-primary" type="button" id="search">Enter</button>
                <input type="hidden" name="lat" id="lat">
                <input type="hidden" name="long" id="long">
                                <div id="map" style="height: 200px;"></div>

            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Poster</label>
                <input type="file" name="poster" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="">Assign Agent</label>
                <select name="agent" class="form-control">
                    <option value=""> Select an agent </option>
                    {% for agent in agents %}
                    <option value="{{ agent.id }}">{{ agent.first_name }} {{ agent.last_name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Date</label>
                <input type="date" name="camp_date" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="">Time</label>
                <input type="time" name="camp_time" class="form-control" id="">
            </div>
        </div>

        <button class="btn btn-success" style="text-align: center;">Create</button>

    </form>

</div>

<script>


let map = L.map('map').setView([10.8505, 76.2711], 7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
}).addTo(map);
let marker = L.marker([10.8505, 76.2711]).addTo(map);
function searchLocation() {
    let location = document.getElementById('location').value.trim();
    if (!location) {
        alert("Please enter a location");
        return;
    }
    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${location}`)
    .then(response => response.json())
    .then(data => {
        if (data.length > 0) {
            const lat = data[0].lat;
            const lon = data[0].lon;
            map.setView([lat, lon], 13);
            marker.setLatLng([lat, lon]);
            document.getElementById('lat').value = lat;
            document.getElementById('long').value = lon;
        } else {
            alert("Location Not found!!");
        }
    });
}
document.getElementById('location').addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        e.preventDefault();
        searchLocation(); 
    }
});
document.getElementById('search').addEventListener("click", function (){
    searchLocation();
})
</script>

{% endblock %}
