{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>

<body class="d-flex flex-column min-vh-100"> 
  {% include 'navbar.html' %}

<div class="flex-grow-1 d-flex align-items-center py-4">

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-11 col-sm-8 col-md-5 col-lg-4">

          <div class="card shadow-lg border-0 rounded-4 p-4" style="padding: 20px;">
            <div class="card-body">
              <h3 class="text-center text-primary mb-4">User Login</h3>
              {% if messages %}
              {% for message in messages %}
              <div class="alert alert-{{ message.tags }} text-center">
                {{ message }}
              </div>
              {% endfor %}
              {% endif %}

              <form method="POST" action="{% url 'login_fun' %}" autocomplete="off">
                {% csrf_token %}

                <div class="form-group mb-3">
                  <label for="username" class="form-label fw-semibold">Username</label>
                  <input type="text" name="uname" id="username" class="form-control" placeholder="Enter your username"
                    required>
                </div>

                <div class="form-group mb-3">
                  <label for="password" class="form-label fw-semibold">Password</label>
                  <input type="password" name="pword" id="password" class="form-control"
                    placeholder="Enter your password" required>
                </div>

                <div class="d-grid mt-4">
                  <button type="submit" class="btn btn-primary">Login</button>
                </div>
              </form>

            </div>
          </div>

        </div>
      </div>
    </div>

  </div>

  {% include 'footer.html' %}

</body>

</html>
