<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InLife Insurance</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome (v6+) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        :root {
            --sidebar-expanded-width: 260px;
            --sidebar-collapsed-width: 84px;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI";
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-expanded-width);
            min-height: 100vh;
            background: linear-gradient(180deg, #2C2F7D, #3A57C4, #78A6FB);
            position: fixed;
            top: 0;
            left: 0;
            transition: all 0.3s ease;
            z-index: 1050;
            display: flex;
            flex-direction: column;
            color: #fff;
            padding: 0.5rem;
        }

        .table-responsive {
            overflow-x: auto !important;
            -webkit-overflow-scrolling: touch;
        }

        /* Collapsed (desktop) */
        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        .sidebar.collapsed .link-text,
        .sidebar.collapsed .sidebar-title {
            opacity: 0;
            max-width: 0;
            transform: translateX(-6px);
            pointer-events: none;
            color: white;
        }

        main.content {
            flex: 1;
            padding: 25px;
            max-width: 100%;
            overflow-x: auto;
        }

        .sidebar.collapsed~main.content {
            margin-left: 80px;
        }

        .link-text {
            transition: opacity 180ms ease, max-width 180ms ease;
            white-space: nowrap;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            max-width: 200px;
            opacity: 1;
        }


        .nav-icon {
            width: 28px;
            text-align: center;
            display: inline-block;
        }

        .content-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin-left: var(--sidebar-expanded-width);
            transition: margin-left 0.3s ease;
        }



        .sidebar.collapsed~.content-wrapper {
            margin-left: var(--sidebar-collapsed-width);
        }

        .dashboard-footer {
            background: #f8f9fa;
            color: #6c757d;
            font-size: 0.813rem;
            text-align: center;
            padding: 10px 0;
            border-top: 1px solid #e5e5e5;
        }


        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .content-wrapper {
                margin-left: 0;
            }

            main.content {
                padding: 15px;
            }
        }


        .agent-container {
            max-width: 450px;
            margin: 40px auto;
            background: #ffffff;
            padding: 20px 35px;
            border-radius: 16px;
            box-shadow: 0px 6px 18px rgba(0, 0, 0, 0.08);
        }

        .profile {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            box-shadow: 0 10px 20px gray;
            border-radius: 15px;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50px;
            border: 3px solid black;
        }

        .edit_container {
            max-width: 450px;
            margin: 40px auto;
            background: #ffffff;
            padding: 20px 35px;
            border-radius: 16px;
            box-shadow: 0px 6px 18px rgba(0, 0, 0, 0.08);
        }

        .campaign-container {
            max-width: 550px;
            margin: 40px auto;
            background: #ffffff;
            padding: 20px 35px;
            border-radius: 16px;
            box-shadow: 0px 6px 18px rgba(0, 0, 0, 0.08);
        }

        .campaign_view_container {
            max-width: 1300px;
            height: auto;
            margin: auto;
            background: #ffffff;
            padding: 20px 35px;
            border-radius: 16px;
            box-shadow: 0px 6px 18px rgba(0, 0, 0, 0.08);
        }

        .Client-container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            padding: 20px 35px;
            border-radius: 16px;
            box-shadow: 0px 6px 18px rgba(0, 0, 0, 0.08);

        }
    </style>
</head>

<body>
    {% include 'sidebars/role_sidebar.html' %}
    <div class="d-md-none d-flex align-items-center p-2 bg-dark text-white">
        <button class="btn btn-outline-light btn-sm" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <span class="ms-2 fw-semibold">Dashboard</span>
    </div>
    <div class="content-wrapper">
        <main class="content">
            {% block content %}{% endblock %}
        </main>

        <footer class="dashboard-footer mt-auto">
            <span class="d-none d-sm-inline">© 2026 InLife Insurance. All Rights Reserved.</span>
            <span class="d-sm-none">© 2026 InLife Insurance. All Rights Reserved.</span>
        </footer>
    </div>

    <script>

        document.addEventListener('DOMContentLoaded', function () {

            const sidebar = document.getElementById('sidebar');
            if (!sidebar) {
                console.error("Sidebar element not found!");
                return;
            }

            window.toggleSidebar = function () {
                if (window.innerWidth <= 768) {
                    sidebar.classList.toggle('mobile-open');
                } else {
                    sidebar.classList.toggle('collapsed');
                }
            };

            try {
                const collapsed = localStorage.getItem('sidebar-collapsed') === 'true';
                if (collapsed && window.innerWidth > 768) {
                    sidebar.classList.add('collapsed');
                }
            } catch (e) { }


            sidebar.addEventListener('transitionend', () => {
                try {
                    localStorage.setItem(
                        'sidebar-collapsed',
                        sidebar.classList.contains('collapsed')
                    );
                } catch (e) { }
            });

        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>


</body>

</html>
