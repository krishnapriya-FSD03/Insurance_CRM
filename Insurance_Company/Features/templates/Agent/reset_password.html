{% extends 'base.html' %}
{% block content %}
<div class="agent-container">
    <div class="page-title">
        <h3>Reset Password</h3>
        {% if messages %}
        {% for message in messages %}
        <div class="alert 
                {% if message.tags == 'error' %}alert-danger
                {% elif message.tags == 'success' %}alert-success
                {% elif message.tags == 'info' %}alert-info
                {% else %}alert-secondary{% endif %}
                alert-dismissible fade show mt-3" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}

        <form action="{% url 'reset_pass_fun' %}" method="post" enctype="multipart/form-data" id="pass_form">
            {% csrf_token %}

            <div>
                <label for="">Current Password</label>
                <input type="password" name="cpass" id="cpass" class="form-control">
                <small id="cmsg"></small>
            </div><br>

            <div>
                <label for="">New Password</label>
                <input type="password" name="npass" id="npass" class="form-control">
                <small id="nmsg"></small>

            </div><br>

            <div>
                <label for="">Confirm Password</label>
                <input type="password" name="copass" id="copass" class="form-control">
                <small id="comsg"></small>
            </div><br>

            <div class="text-center">
                <button id="submit" class="btn btn-success">Change</button>
            </div>


        </form>

    </div>
</div>

<script>


    let current = document.getElementById('cpass');
    let cmsg = document.getElementById("cmsg");
    let new_pass = document.getElementById('npass')
    let nmsg = document.getElementById('nmsg')
    let copass = document.getElementById('copass')
    let comsg = document.getElementById('comsg')
    let pass_form = document.getElementById('pass_form')

    const pass_regex = /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/

    current.addEventListener("input", () => {
        if (current.value === '') {
            cmsg.innerHTML = 'Current Password cannot be empty';
            cmsg.style.color = 'red'
        } else {
            cmsg.innerHTML = ''
        }
    })

    new_pass.addEventListener("input", () => {
        if (!pass_regex.test(new_pass.value)) {
            nmsg.innerHTML = 'Password must contain 8+ characters including all characters';
            nmsg.style.color = 'red'
        }
        else {
            nmsg.innerHTML = 'Strong password'
            nmsg.style.color = 'green'
        }
    })

    copass.addEventListener("input", () => {

        if (new_pass.value !== copass.value) {
            comsg.innerHTML = 'Passwords does not match';
            comsg.style.color = 'red'
        }

        else {
            comsg.innerHTML = "passwords matched"
            comsg.style.color = 'green'
        }
    })


    pass_form.addEventListener("submit", (e) => {
        if (current.value == '' || !pass_regex.test(new_pass.value) || new_pass.value !== copass.value) {
            e.preventDefault();
            alert("Check Your Password before submitting!!")
        }
    })
    // });

</script>

{% endblock %}
